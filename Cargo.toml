[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
murmur-core = { path = "crates/murmur-core" }
murmur-stt = { path = "crates/murmur-stt" }
murmur-audio = { path = "crates/murmur-audio" }
murmur-platform = { path = "crates/murmur-platform" }
murmur-control = { path = "crates/murmur-control" }
murmur-engine = { path = "crates/murmur-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
