[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
squawk-core = { path = "crates/squawk-core" }
squawk-stt = { path = "crates/squawk-stt" }
squawk-audio = { path = "crates/squawk-audio" }
squawk-platform = { path = "crates/squawk-platform" }
squawk-control = { path = "crates/squawk-control" }
squawk-engine = { path = "crates/squawk-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
