# Formatting, lints and tests for the Rust workspace in rust/, on the two platforms Murmur ships
# for: macOS (Apple Silicon) and Linux (x86_64, like the Omarchy machine). Clippy runs on both
# because each OS compiles its own platform code. No releases are built here.
name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only help locally; on CI they just make the cache bigger.
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # cpal's ALSA backend needs the ALSA headers to build. sherpa-onnx downloads its own
      # prebuilt libraries during the build, so it needs nothing installed.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # sherpa-onnx's build script downloads its prebuilt libraries into target/, and rust-cache
      # prunes them before saving. A restored cache skips the build script, so the macOS link
      # (shared libraries there) then fails with "library 'sherpa-onnx-c-api' not found". This
      # step comes after rust-cache so that its save, run in reverse order, comes before that
      # pruning.
      - uses: actions/cache@v4
        id: sherpa
        with:
          path: rust/target/sherpa-onnx-prebuilt
          key: sherpa-onnx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}

      # Without them (a first run, or this cache evicted while rust-cache's remains), make the
      # build script run again and download them.
      - name: Forget sherpa-onnx's build if its libraries aren't cached
        if: steps.sherpa.outputs.cache-hit != 'true'
        run: cargo clean -p sherpa-onnx-sys

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Tests that need the speech model, a Claude key or a desktop are #[ignore]d and skipped.
      - name: Test
        run: cargo test --workspace --locked
