[package]
name = "squawk-audio"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
squawk-core.workspace = true
# Cross-platform audio I/O: CoreAudio on macOS, WASAPI on Windows, ALSA on Linux (needs the
# ALSA headers to build: libasound2-dev on Debian/Ubuntu, alsa-lib on Arch).
cpal = "0.18.2"
# Band-limited resampling to 16 kHz for speech recognition.
rubato = "5.0.1"
# Decoding the in-memory start/stop sounds.
hound = "3.5.1"

# Opening a PipeWire microphone by node name through pipewire-alsa (see src/pipewire.rs). The
# same version cpal uses for its ALSA host.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11.0"
