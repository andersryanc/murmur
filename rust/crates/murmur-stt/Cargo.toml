[package]
name = "murmur-stt"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
murmur-core.workspace = true
ureq = "3.5.0"
bzip2 = "0.6.1"
tar = "0.4.46"

# The official k2-fsa bindings, which download sherpa-onnx's prebuilt libraries (onnxruntime
# included) at build time. Static elsewhere, so there's nothing to ship. On macOS the shared
# build, because Parakeet runs about twice as fast with it (same ONNX Runtime version; we don't
# know why); its two dylibs are copied next to each binary and into the app's Frameworks.
[target.'cfg(not(target_os = "macos"))'.dependencies]
sherpa-onnx = "1.13.8"

[target.'cfg(target_os = "macos")'.dependencies]
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }

[dev-dependencies]
hound = "3.5.1"
