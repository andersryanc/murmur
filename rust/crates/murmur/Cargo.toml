[package]
name = "murmur"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
murmur-core.workspace = true
murmur-stt.workspace = true
murmur-audio.workspace = true
murmur-platform.workspace = true
# The menu-bar (macOS) / notification-area (Windows) / AppIndicator (Linux) icon and its menu.
# The menu types come from tray-icon's re-export of muda, so the two versions always match.
tray-icon = "0.26.1"
# The main-thread event loop tray-icon is built and documented against.
tao = "0.37.1"
# Copying a recent dictation without pasting it.
arboard = "3.7.0"
# Log to a file and stderr.
simplelog = "0.12.2"
# Glyph outlines and coverage for the recording pill's text, from the system UI font.
ab_glyph = "0.2.32"
# Messages between the Dictionary window's page and the app.
serde.workspace = true
serde_json.workspace = true

# The Dictionary window: a web view (WKWebView, WebView2) in a tao window. Linux opens the JSON in
# an editor instead, so it doesn't need WebKitGTK.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "0.57.0", default-features = false, features = ["os-webview"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Launch at Login: registers the app bundle as a login item.
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
] }
# Only to read the microphone permission state for the menu's warning.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVCaptureDevice",
    "AVMediaFormat",
] }
# The recording pill: a non-activating panel showing the pill's pixels as a layer's contents.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSArray"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "CALayer",
    "CATransaction",
] }
