# Generates Murmur.xcodeproj. Run `xcodegen` in this folder (scripts/install.sh does it for you).
name: Murmur
options:
  bundleIdPrefix: com.plyhdrn
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Core:
    path: ../Core
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Murmur:
    type: application
    platform: macOS
    sources: [Murmur]
    dependencies:
      - package: Core
        product: MurmurCore
    info:
      path: Murmur/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Murmur listens while you hold the dictation key, and only then.
    entitlements:
      path: Murmur/Murmur.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plyhdrn.murmur
        PRODUCT_NAME: Murmur
        # Signed with a stable identity (set in Signing.xcconfig) so macOS keeps the Accessibility
        # and Microphone permissions across rebuilds. No provisioning profile is needed.
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        COMBINE_HIDPI_IMAGES: YES
